<!doctype html>
<html lang="fr">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=5, user-scalable=yes" />

    <!-- PWA / App identity -->
    <title>ADM GP</title>
    <meta name="application-name" content="ADM GP" />
    <meta name="description" content="Optimisation et Organisation — plannings, réunions, missions" />

    <!-- Theme color (Android Chrome, status bar) -->
    <meta name="theme-color" content="#2596be" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1a6a8a" media="(prefers-color-scheme: dark)" />

    <!-- iOS PWA -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ADM GP" />

    <!-- Android/Chrome standalone -->
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- Windows tiles -->
    <meta name="msapplication-TileColor" content="#2596be" />
    <meta name="msapplication-TileImage" content="/icons/icon-192.png" />
    <meta name="msapplication-config" content="none" />

    <!-- Favicons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="shortcut icon" href="/favicon.ico" />

    <!-- Apple touch icons -->
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="152x152" href="/apple-icon-152x152.png" />
    <link rel="apple-touch-icon" sizes="144x144" href="/apple-icon-144x144.png" />
    <link rel="apple-touch-icon" sizes="120x120" href="/apple-icon-120x120.png" />

    <!-- NOTE: <link rel="manifest"> is injected automatically by vite-plugin-pwa -->
</head>

<body>
    <div id="popup-root" style="position:fixed;top:0;left:0;width:0;height:0;z-index:999"></div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
</body>

</html>
