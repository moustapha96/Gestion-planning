<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A365D"/>
      <stop offset="100%" stop-color="#1e4d8c"/>
    </linearGradient>
    <linearGradient id="ag" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38A169"/>
      <stop offset="100%" stop-color="#68D391"/>
    </linearGradient>
    <clipPath id="c">
      <path d="M96,20 C62,20 36,46 36,74 C36,116 96,172 96,172 C96,172 156,116 156,74 C156,46 130,20 96,20 Z"/>
    </clipPath>
  </defs>
  <!-- White background rounded square -->
  <rect width="192" height="192" rx="40" fill="white"/>
  <!-- Shield outline -->
  <path d="M96,14 C58,14 28,44 28,74 C28,120 96,182 96,182 C96,182 164,120 164,74 C164,44 134,14 96,14 Z"
