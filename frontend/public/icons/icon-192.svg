  <path d="M40,74 A56,56 0 0,1 96,18" fill="none" stroke="#1A365D" stroke-width="8"
        stroke-linecap="round" opacity="0.45"/>
  <!-- Bars + arrow inside shield -->
  <g clip-path="url(#c)">
    <rect x="36" y="124" width="18" height="52" rx="3" fill="#1A365D" opacity="0.85"/>
    <rect x="58" y="106" width="18" height="70" rx="3" fill="#1A365D" opacity="0.85"/>
    <rect x="80" y="86"  width="18" height="90" rx="3" fill="#1A365D" opacity="0.85"/>
    <rect x="102" y="64" width="18" height="112" rx="3" fill="#1A365D" opacity="0.85"/>
    <rect x="124" y="42" width="18" height="134" rx="3" fill="#1A365D" opacity="0.85"/>
    <line x1="34" y1="142" x2="148" y2="30" stroke="url(#ag)" stroke-width="12"
          stroke-linecap="round"/>
    <polygon points="148,30 118,36 136,60" fill="#48BB78"/>
  </g>
</svg>
