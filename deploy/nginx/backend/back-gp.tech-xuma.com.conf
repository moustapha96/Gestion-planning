# Backend API — Gestion Planning
# Domaine : https://back-gp.tech-xuma.com
# Proxy vers PM2 (Node) sur 127.0.0.1:3001
#
# Installation :
#   sudo cp deploy/nginx/backend/back-gp.tech-xuma.com.conf /etc/nginx/sites-available/
#   sudo ln -sf /etc/nginx/sites-available/back-gp.tech-xuma.com.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Certificat TLS :
#   sudo certbot --nginx -d back-gp.tech-xuma.com
#
# PM2 :
#   cd /var/www/gpadm/backend && pm2 start ../deploy/pm2/ecosystem.config.cjs

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream gp_backend {
    server 127.0.0.1:3001;
    keepalive 32;
}

# Redirection HTTP → HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name back-gp.tech-xuma.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name back-gp.tech-xuma.com;

    ssl_certificate     /etc/letsencrypt/live/back-gp.tech-xuma.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/back-gp.tech-xuma.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 50M;

    access_log /var/log/nginx/back-gp_access.log;
    error_log  /var/log/nginx/back-gp_error.log;

    # Healthcheck (sans /api)
    location = /health {
        proxy_pass http://gp_backend/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API REST
    location ^~ /api/ {
        proxy_pass http://gp_backend/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_buffering off;
    }

    # Fichiers uploadés (logos, PDF missions/réunions, avatars…)
    location ^~ /uploads/ {
        proxy_pass http://gp_backend/uploads/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 7d;
        add_header Cache-Control "public";
    }

    # Socket.IO (messagerie, présence temps réel)
    location ^~ /socket.io/ {
        proxy_pass http://gp_backend/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 3600s;
    }

    # Swagger (optionnel — protégé côté app par SWAGGER_USER/PASS)
    location ^~ /api/docs {
        proxy_pass http://gp_backend/api/docs;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
}
