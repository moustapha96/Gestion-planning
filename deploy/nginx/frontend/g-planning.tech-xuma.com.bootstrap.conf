# Bootstrap HTTP uniquement — avant certificat TLS
# Remplacer par g-planning.tech-xuma.com.conf après certbot

server {
    listen 80;
    listen [::]:80;
    server_name g-planning.tech-xuma.com;

    client_max_body_size 20M;
    access_log /var/log/nginx/g-planning_access.log;
    error_log  /var/log/nginx/g-planning_error.log;

    root /var/www/gpadm/frontend/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|map|webmanifest)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
