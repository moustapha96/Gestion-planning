# Frontend — Gestion Planning
# Domaine : https://g-planning.tech-xuma.com
#
# Installation :
#   sudo cp deploy/nginx/frontend/g-planning.tech-xuma.com.conf /etc/nginx/sites-available/
#   sudo ln -sf /etc/nginx/sites-available/g-planning.tech-xuma.com.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Certificat TLS (Let's Encrypt) :
#   sudo certbot --nginx -d g-planning.tech-xuma.com
#
# Adapter GPADM_ROOT si le dépôt n'est pas dans /var/www/gpadm

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Redirection HTTP → HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name g-planning.tech-xuma.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name g-planning.tech-xuma.com;

    # Certificats Let's Encrypt (créés par certbot)
    ssl_certificate     /etc/letsencrypt/live/g-planning.tech-xuma.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/g-planning.tech-xuma.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 20M;

    access_log /var/log/nginx/g-planning_access.log;
    error_log  /var/log/nginx/g-planning_error.log;

    # Build Vite (npm run build)
    root /var/www/gpadm/frontend/dist;
    index index.html;

    # SPA React — routes client (/meetings, /dashboard, …)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Assets statiques (hors /uploads — servis par le backend)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|map|webmanifest)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # Sécurité de base
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
